services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: sentinel_redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: pgvector/pgvector:pg15
    container_name: sentinel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pg_data:/var/lib/postgresql/data
      - ./app/infrastructure/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: sentinel_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@timescaledb:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
    # Live-mount host source so Uvicorn --reload picks up changes without --build
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: sentinel_worker
    command: celery -A app.core.celery_app.celery_application worker --loglevel=info
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@timescaledb:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
    # Live-mount host source so code changes apply on `docker compose restart worker`
    volumes:
      - .:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    container_name: sentinel_celery_beat
    command: celery -A app.core.celery_app.celery_application beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@timescaledb:5432/sentinel_db
      - REDIS_URL=redis://redis:6379/0
    # Live-mount host source so code changes apply on `docker compose restart celery-beat`
    volumes:
      - .:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: base
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    entrypoint: ""
    command: >
      sh -c "until wget -q -O - api:8080/docs > /dev/null 2>&1; do echo 'Waiting for API to be ready...'; sleep 2; done; npx next dev -H 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      api:
        condition: service_started

volumes:
  sentinel_pg_data:
  frontend_node_modules: