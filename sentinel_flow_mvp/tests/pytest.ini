[pytest]
# =============================================================================
# Pytest Configuration for Sentinel-Flow Backend Tests
# =============================================================================
# Beginner Note: Async tests in this project use the `anyio` plugin.
# Each async test function must be decorated with @pytest.mark.anyio
# to actually run (not just be silently skipped/un-awaited).
# =============================================================================
testpaths = tests
markers =
    integration: Tests that exercise multiple services together (not unit tests).
