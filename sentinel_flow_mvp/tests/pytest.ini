[pytest]
# =============================================================================
# Pytest Configuration for Sentinel-Flow Backend Tests
# =============================================================================
# Beginner Note: This file tells pytest where to find our tests and how to
# behave. The most important setting here is 'asyncio_mode = auto' which lets
# us write async test functions without decorating every single one with
# @pytest.mark.asyncio. Without this, async tests would silently pass without
# actually awaiting.
# =============================================================================

asyncio_mode = auto
testpaths = tests
markers =
    integration: Tests that exercise multiple services together (not unit tests).
